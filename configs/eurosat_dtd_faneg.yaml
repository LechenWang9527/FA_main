# ------ root_path ------
root_path: "/root/autodl-tmp/DATA"
ood_dataset_path: "/root/autodl-tmp/DATA"
clip_model_path: "/root/autodl-tmp/clip_weights"

# ------ id dataset ------
id_dataset: "eurosat"

# ------ ood_dataset ------
ood_dataset: "dtd"

# ------ Hyperparamters ------
seed: 1

shots: 4
backbone: "ViT-B/16"
K: 3
csc: False
template: "a photo of a"

lr: 0.002
fine_tune_train_epoch: 5
fine_tune_batch_size: 32

test_batch_size: 64

# ------ FA-Neg Improvement ------
use_negative_prompt: True
negative_template: "a photo of not a"
negative_template_name: "notphoto"

# training weights for negative prompt branch
lambda_neg: 0.1
lambda_margin: 0.1
neg_margin: 0.1
neg_loss_scale: 100.0

use_sct_weight: True
sct_gamma: 1.0
margin_correct_only: True
# inference weight; only affects test-time confidence fusion
alpha_neg: 0.5
