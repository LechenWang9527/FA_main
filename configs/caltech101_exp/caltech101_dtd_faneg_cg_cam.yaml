root_path: "/root/autodl-tmp/DATA"
ood_dataset_path: "/root/autodl-tmp/DATA"
clip_model_path: "/root/autodl-tmp/clip_weights"

id_dataset: "caltech101"
ood_dataset: "dtd"

seed: 1
shots: 4
backbone: "ViT-B/16"
K: 3
csc: False
template: "a photo of a"

lr: 0.002
fine_tune_train_epoch: 200
fine_tune_batch_size: 160
test_batch_size: 64

use_negative_prompt: True
negative_template: "a photo of not a"
negative_template_name: "notphoto"

lambda_neg: 0.1
lambda_margin: 0.15
neg_margin: 0.1
neg_loss_scale: 100.0

use_conf_gate: True
conf_gate_min: 0.5
conf_gate_gamma: 1.0
margin_correct_only: True

use_class_adaptive_margin: True
